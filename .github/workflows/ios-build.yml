name: iOS build

# Compiles the iPhone app on a GitHub macOS runner, unsigned, for the simulator.
# It needs no Apple Developer account: it proves the CocoaPods project, the
# plugins and AppDelegate.swift build, so the first signed build on Codemagic
# (codemagic.yaml) is not also the first time any of this is compiled.
# Free here because the repository is public.

on:
  push:
    branches: [main]
    paths:
      - "prixes-platform/apps/web/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prixes-platform/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync ios

      # Same check as codemagic.yaml: the plist is for this app, and the Google
      # sign-in URL scheme in Info.plist is its REVERSED_CLIENT_ID.
      - name: Check the Firebase configuration
        run: |
          PLIST=ios/App/App/GoogleService-Info.plist
          plutil -lint "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$PLIST")" = software.omnilink.prixes
          test "$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$PLIST")" = \
               "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' ios/App/App/Info.plist)"
          echo "Firebase config and Google sign-in URL scheme match."

      - name: Build for the iOS simulator (unsigned)
        working-directory: prixes-platform/apps/web/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || { grep -E "error:|BUILD FAILED" build.log | head -n 40; tail -n 30 build.log; exit 1; }
          tail -n 5 build.log
